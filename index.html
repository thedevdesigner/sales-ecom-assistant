<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
(async () => {
  console.log("🚀 Testing direct /chat POST connection...");
  try {
    const res = await fetch('https://sales-ecom-assistant.onrender.com/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/octet-stream'
      },
      body: JSON.stringify({
        vendorId: 'nordic-knives',
        sessionId: 'test-123',
        pageUrl: location.href, // <--- ADDED THIS LINE
        messages: [{ role: 'user', content: 'i am looking for latest collection you have' }],
        stream: true
      })
    });
    
    console.log("📥 Response status:", res.status);
    console.log("📥 Response headers:", [...res.headers.entries()]);

    if (!res.ok) {
      console.error("❌ /chat rejected the request:", await res.text());
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    
    const { value, done } = await reader.read();
    console.log("📥 First chunk received:", decoder.decode(value));
  } catch (err) {
    console.error("❌ /chat network or CORS failure:", err);
  }
})();
    </script>
</body>
</html>
